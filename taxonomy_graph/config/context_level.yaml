# Combined Taxonomy Configuration - Context-Level Version
# Same category entries as the original combined taxonomy.
#
#

categories:

  Public: Public
  Private: Private
  Name: Name [File, Class, Function]
  Type: Type
  InputType: Input Type
  OutputType: Output Type
  SuperClass: Super Class (for Class)
  Location: Location [Partial, Complete]
  Variable: Variable [Name, Type]
  Parameter: Parameter [Name, Type]
  Exception: Exception [Location, Type]
  ExactString: Exact String (Error Msg)
  WeakSemantics: Weak Semantics Description
  StrongSemantics: Strong Semantics Description


# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A.
#
# Context-level interpretation:
# - The graph still has refinement edges inside each context.
# - It avoids saying that class context is always more revealing than file context,
#   or that function context is always more revealing than class context.
# - File, ClassName, and FuncName are same-level identity facts.

relations:
  # === MAIN STREAM: File -> Class -> Function ===
  - ["Public", "Name"]
  - ["Name", "Type"]
  - ["Name", "Location"]
  - ["Name", "Variable"]
  - ["Name", "Parameter"]
  - ["Name", "Exception"]

  - ["Type", "InputType"]
  - ["Type", "OutputType"]
  - ["Type", "SuperClass"]

  - ["Exception", "ExactString"]

  - ["InputType", "WeakSemantics"]
  - ["OutputType", "WeakSemantics"]
  - ["SuperClass", "WeakSemantics"]
  - ["Location", "WeakSemantics"]
  - ["Variable", "WeakSemantics"]
  - ["Parameter", "WeakSemantics"]
  - ["ExactString", "WeakSemantics"]

  - ["WeakSemantics", "StrongSemantics"]

  - ["StrongSemantics", "Private"]
