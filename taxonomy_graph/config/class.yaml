# Class Configuration
# Define categories and their relationships

categories:
  Class: "Class"
  # Func: "Function"
  Name: "Class Name"
  SuperC: "Super Class"
  Generic: "Generic"
  # Constr: "Constructor"
  LocVar: "Local variables"
  # LocClass: "Class Location"
  LocPar: "Class Partial Location"
  LocComp: "Class Complete Location"
  # Desc: "Description"
  WeakS: "Weak Semantics Description"
  StrongS: "Strong Semantics Description"
  FuncPub: "Public Functions"
  FuncPriv: "Private Functions"
  # ParamList: "Parameter List"
  # VarAssign: "Variable Assignments"
  # ParamType: "Parameter Type"
  # ParamDefault: "Parameter Default Value"
  # Setup: "Setup Routines"


# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A
relations:
  # Class as root (depth = 0)
  - ["Class", "Name"]
  - ["Class", "FuncPub"]
  - ["Class", "SuperC"]
  - ["Class", "Generic"]
  - ["Class", "LocPar"]
  - ["Class", "WeakS"]
  - ["Class", "LocVar"]

  # Function as parent (depth = 1)
  # - ["Func", "FuncPub"]
  - ["FuncPub", "FuncPriv"]

  # Weak Semantics Description as parent (depth = 1)
  - ["WeakS", "StrongS"]

  # Constructor as parent (depth = 1)
  # - ["Constr", "ParamList"]
  # - ["Constr", "VarAssign"]
  # - ["Constr", "ParamType"]
  # - ["Constr", "ParamDefault"]
  # - ["Constr", "Setup"]

  # Partial Class location as parent (depth = 1)
  - ["LocPar", "LocComp"]

