# Hint Taxonomy Configuration
# Define categories and their relationships

categories:
  Func: "Function"
  Name: "Name"
  Sign: "Signature"
  InS: "Input Spec"
  OutS: "Output Spec"
  InT: "Input type"
  OutT: "Output type"
  InN: "Input name"
  OutN: "Output name"
  LocVar: "Local variables"
  LocFunc: "Function Location"
  LocPar: "Partial Location"
  LocComp: "Complete Location"
  Desc: "Description"
  WeakS: "Weak Semantics"
  StrongS: "Strong Semantics"
  Except: "Exception"
  ExceptExact: "Exact Exception"
  ExceptType: "Exception Type"

# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A
relations:
  # Function as root (depth = 0)
  - ["Func", "Name"]
  - ["Func", "Sign"]
  - ["Func", "LocFunc"]
  - ["Func", "Desc"]
  - ["Func", "Except"]
  - ["Func", "LocVar"]

  # Function Signature as parent (depth = 1)
  - ["Sign", "InS"]
  - ["Sign", "OutS"]
  - ["InS", "InT"]
  - ["OutS", "OutT"]
  - ["InS", "InN"]
  - ["OutS", "OutN"]

  # Function Location as parent (depth = 1)
  - ["LocFunc", "LocPar"]
  - ["LocFunc", "LocComp"]
  
  # Description as parent (depth = 1)
  - ["Desc", "WeakS"]
  - ["Desc", "StrongS"]

  # Exception as parent (depth = 1)
  - ["Except", "ExceptExact"]
  - ["Except", "ExceptType"]

