# Combined Taxonomy Configuration
# Merges File, Class, and Function taxonomies
# Main stream: File -> Class -> Function

categories:
  # File level
  File: "File"
  FileLoc: "File Location"
  Import: "Import Statement"
  NewFile: "New File"
  ModifiedFile: "Modified File"
  
  # Class level
  Class: "Class"
  ClassName: "Class Name"
  SuperC: "Super Class"
  Constr: "Constructor"
  LocVarClass: "Cls Local Variables"
  LocClass: "Cls Location"
  LocParClass: "Cls Partial Location"
  LocCompClass: "Cls Complete Location"
  DescClass: "Cls Description"
  WeakSClass: "Cls Weak Semantics"
  StrongSClass: "Cls Strong Semantics"
  ParamList: "Parameter List"
  VarAssign: "Variable Assignments"
  ParamType: "Parameter Type"
  ParamDefault: "Parameter Default Value"
  Setup: "Setup Routines"
  
  # Function level
  Func: "Function"
  FuncPub: "Public Functions"
  FuncPriv: "Private Functions"
  FuncName: "Function Name"
  Sign: "Signature"
  InS: "Input Spec"
  OutS: "Output Spec"
  InT: "Input Type"
  OutT: "Output Type"
  InN: "Input Name"
  OutN: "Output Name"
  LocVarFunc: "Func Local Variables"
  LocFunc: "Func Location"
  LocParFunc: "Func Partial Location"
  LocCompFunc: "Func Complete Location"
  DescFunc: "Func Description"
  WeakSFunc: "Func Weak Semantics"
  StrongSFunc: "Func Strong Semantics"
  Except: "Exception"
  ExceptExact: "Exact Exception"
  ExceptType: "Exception Type"

# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A
# Main stream emphasized: File -> Class -> Function
relations:
  # === MAIN STREAM: File -> Class -> Function ===
  - ["File", "Class"]
  - ["Class", "Func"]
  
  # === File level relations ===
  - ["File", "FileLoc"]
  - ["File", "Import"]
  
  # File location details
  - ["FileLoc", "NewFile"]
  - ["FileLoc", "ModifiedFile"]
  
  # === Class level relations ===
  - ["Class", "ClassName"]
  - ["Class", "SuperC"]
  - ["Class", "Constr"]
  - ["Class", "LocClass"]
  - ["Class", "DescClass"]
  - ["Class", "LocVarClass"]
  
  # Class description
  - ["DescClass", "WeakSClass"]
  - ["DescClass", "StrongSClass"]
  
  # Constructor details
  - ["Constr", "ParamList"]
  - ["Constr", "VarAssign"]
  - ["Constr", "ParamType"]
  - ["Constr", "ParamDefault"]
  - ["Constr", "Setup"]
  
  # Class location
  - ["LocClass", "LocParClass"]
  - ["LocClass", "LocCompClass"]
  
  # === Function level relations ===
  - ["Func", "FuncPub"]
  - ["Func", "FuncPriv"]
  - ["Func", "FuncName"]
  - ["Func", "Sign"]
  - ["Func", "LocFunc"]
  - ["Func", "DescFunc"]
  - ["Func", "Except"]
  - ["Func", "LocVarFunc"]
  
  # Function signature
  - ["Sign", "InS"]
  - ["Sign", "OutS"]
  - ["InS", "InT"]
  - ["OutS", "OutT"]
  - ["InS", "InN"]
  - ["OutS", "OutN"]
  
  # Function location
  - ["LocFunc", "LocParFunc"]
  - ["LocFunc", "LocCompFunc"]
  
  # Function description
  - ["DescFunc", "WeakSFunc"]
  - ["DescFunc", "StrongSFunc"]
  
  # Exception handling
  - ["Except", "ExceptExact"]
  - ["Except", "ExceptType"]