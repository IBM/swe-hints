# Combined Taxonomy Configuration v3
# Merges File, Class, Function, and Variable taxonomies
# Main stream: File -> Func / File -> Var
#              Class -> ClsFunc / Class -> ClsVar
# File, Class, Func, Var are all at the same depth (top-level peers)

categories:
  # File level
  File: "File"
  FileLoc: "File Location"
  Import: "Import Statement"
  NewFile: "New File"
  ModifiedFile: "Modified File"

  # Class level
  Class: "Class"
  ClassName: "Class Name"
  SuperC: "Super Class"
  Generic: "Generic"
  LocParClass: "Cls Partial Location"
  LocCompClass: "Cls Complete Location"
  WeakSClass: "Cls Weak Semantics"
  StrongSClass: "Cls Strong Semantics"
  FuncPub: "Public Functions"
  FuncPriv: "Private Functions"

  # Cls Function level (function under class)
  ClsFunc: "Cls Function"
  ClsFuncName: "Cls Function Name"
  ClsSign: "Cls Function Signature"
  ClsInS: "Cls Function Input Spec"
  ClsInT: "Cls Function Input Type"
  ClsInN: "Cls Function Input Name"
  ClsOutPT: "Cls Function Output Partial Type"
  ClsOutCT: "Cls Function Output Complete Type"
  ClsLocParFunc: "Cls Function Partial Location"
  ClsLocCompFunc: "Cls Function Complete Location"
  ClsWeakSFunc: "Cls Function Weak Semantics"
  ClsStrongSFunc: "Cls Function Strong Semantics"
  ClsExceptValue: "Cls Function Exception Value"
  ClsExceptType: "Cls Function Exception Type"
  ClsParamDefault: "Cls Function Parameter Default Value"

  # Cls Variable level (variable under class)
  ClsVar: "Cls Variable"
  ClsVarType: "Cls Variable Type"
  ClsVarValue: "Cls Variable Value"
  ClsLocParVar: "Cls Var Partial Location"
  ClsLocCompVar: "Cls Var Complete Location"
  ClsWeakSVar: "Cls Var Weak Semantics"
  ClsStrongSVar: "Cls Var Strong Semantics"

  # Function level (top-level, under File)
  Func: "Function"
  FuncName: "Function Name"
  Sign: "Signature"
  InS: "Input Spec"
  InT: "Input Type"
  InN: "Input Name"
  OutPT: "Output Partial Type"
  OutCT: "Output Complete Type"
  LocParFunc: "Func Partial Location"
  LocCompFunc: "Func Complete Location"
  WeakSFunc: "Func Weak Semantics"
  StrongSFunc: "Func Strong Semantics"
  ExceptValue: "Exception Value"
  ExceptType: "Exception Type"
  ParamDefault: "Parameter Default Value"

  # Variable level (top-level, under File)
  Var: "Variable"
  VarType: "Variable Type"
  VarValue: "Variable Value"
  LocParVar: "Var Partial Location"
  LocCompVar: "Var Complete Location"
  WeakSVar: "Var Weak Semantics"
  StrongSVar: "Var Strong Semantics"

# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A
relations:
  # === MAIN STREAM: File -> Func / File -> Var (Class is now a peer of File) ===
  - ["File", "Func"]
  - ["File", "Var"]

  # === File level relations ===
  - ["File", "FileLoc"]
  - ["File", "Import"]

  # File location details
  - ["FileLoc", "NewFile"]
  - ["FileLoc", "ModifiedFile"]

  # === Class level relations ===
  - ["Class", "ClassName"]
  - ["Class", "FuncPub"]
  - ["Class", "SuperC"]
  - ["Class", "Generic"]
  - ["Class", "LocParClass"]
  - ["Class", "WeakSClass"]
  - ["Class", "ClsFunc"]
  - ["Class", "ClsVar"]

  # Public/Private functions
  - ["FuncPub", "FuncPriv"]

  # Class semantics
  - ["WeakSClass", "StrongSClass"]

  # Class location
  - ["LocParClass", "LocCompClass"]

  # === Cls Function level relations (function under class) ===
  - ["ClsFunc", "ClsFuncName"]
  - ["ClsFunc", "ClsSign"]
  - ["ClsFunc", "ClsLocParFunc"]
  - ["ClsFunc", "ClsWeakSFunc"]
  - ["ClsFunc", "ClsExceptType"]
  - ["ClsFunc", "ClsParamDefault"]

  # Cls function signature
  - ["ClsSign", "ClsInS"]
  - ["ClsSign", "ClsOutPT"]
  - ["ClsInS", "ClsInT"]
  - ["ClsInS", "ClsInN"]
  - ["ClsOutPT", "ClsOutCT"]

  # Cls function location
  - ["ClsLocParFunc", "ClsLocCompFunc"]

  # Cls function semantics
  - ["ClsWeakSFunc", "ClsStrongSFunc"]

  # Cls exception handling
  - ["ClsExceptType", "ClsExceptValue"]

  # === Cls Variable level relations (variable under class) ===
  - ["ClsVar", "ClsVarType"]
  - ["ClsVar", "ClsVarValue"]
  - ["ClsVar", "ClsLocParVar"]
  - ["ClsVar", "ClsWeakSVar"]

  # Cls variable location
  - ["ClsLocParVar", "ClsLocCompVar"]

  # Cls variable semantics
  - ["ClsWeakSVar", "ClsStrongSVar"]

  # === Function level relations (top-level) ===
  - ["Func", "FuncName"]
  - ["Func", "Sign"]
  - ["Func", "LocParFunc"]
  - ["Func", "WeakSFunc"]
  - ["Func", "ExceptType"]
  - ["Func", "ParamDefault"]

  # Function signature
  - ["Sign", "InS"]
  - ["Sign", "OutPT"]
  - ["InS", "InT"]
  - ["InS", "InN"]
  - ["OutPT", "OutCT"]

  # Function location
  - ["LocParFunc", "LocCompFunc"]

  # Function semantics
  - ["WeakSFunc", "StrongSFunc"]

  # Exception handling
  - ["ExceptType", "ExceptValue"]

  # === Variable level relations (top-level) ===
  - ["Var", "VarType"]
  - ["Var", "VarValue"]
  - ["Var", "LocParVar"]
  - ["Var", "WeakSVar"]

  # Variable location
  - ["LocParVar", "LocCompVar"]

  # Variable semantics
  - ["WeakSVar", "StrongSVar"]

# Made with Bob
