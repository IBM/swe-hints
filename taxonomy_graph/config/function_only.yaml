# Function Taxonomy - extracted from combined_v3.yaml
# Root: Identifier Hints -> Function and all its sub-nodes

categories:
  IdentifierHints: "Identifier Hints"

  # Function level (top-level, under File)
  Func: "Function"
  FuncName: "Function Name"
  Sign: "Signature"
  InS: "Input Spec"
  InT: "Input Type"
  InN: "Input Name"
  OutPT: "Output Partial Type"
  OutCT: "Output Complete Type"
  LocParFunc: "Func Partial Location"
  LocCompFunc: "Func Complete Location"
  WeakSFunc: "Func Weak Semantics"
  StrongSFunc: "Func Strong Semantics"
  ExceptValue: "Exception Value"
  ExceptType: "Exception Type"
  ParamDefault: "Parameter Default Value"

# Relations: A -> B means A ⪯ B, i.e. B is more revealing/specific than A
relations:
  - ["IdentifierHints", "Func"]

  - ["Func", "FuncName"]
  - ["Func", "Sign"]
  - ["Func", "LocParFunc"]
  - ["Func", "WeakSFunc"]
  - ["Func", "ExceptType"]
  - ["Func", "ParamDefault"]

  # Signature
  - ["Sign", "InS"]
  - ["Sign", "OutPT"]
  - ["InS", "InT"]
  - ["InS", "InN"]
  - ["OutPT", "OutCT"]

  # Location
  - ["LocParFunc", "LocCompFunc"]

  # Semantics
  - ["WeakSFunc", "StrongSFunc"]

  # Exception handling
  - ["ExceptType", "ExceptValue"]
